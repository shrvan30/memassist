# External MCP server registry — max 3 active (schemas cost context tokens).
#
# trust: internal   = results pass through untouched
#        untrusted  = results MUST pass security/sanitizer.py before the model
#                     sees them, and can never reach core memory (spec §6.3)
#
# Verified 2026-07-30 against the live package: `uvx duckduckgo-mcp-server`
# starts on stdio and exports search + fetch_content.

servers:
  # Our own memory server. Dispatched IN-PROCESS by MemoryTools, not over stdio:
  # same code either way, and a subprocess hop would add latency and
  # non-determinism to the benchmark for no isolation benefit (it is internal by
  # definition). The stdio entry point still exists — `python -m memory_server`,
  # registered in .mcp.json — so Claude Code/Desktop can drive the same memory.
  memgpt-memory:
    transport: stdio
    command: python
    args: ["-m", "memory_server"]
    trust: internal

  ddg-search:
    transport: stdio
    command: uvx
    args: ["duckduckgo-mcp-server"]
    trust: untrusted          # web content = hostile until sanitized
    enabled: true
    # `tools:` is a load-time allowlist. Every schema listed here rides in EVERY
    # prompt on EVERY turn, so the registry — not the server — decides what the
    # context budget is spent on. Omit the key to load everything a server
    # exports. Unknown names are still denied by security/guards.py either way.
    tools: [search, fetch_content]
    # optional upgrade: swap for Tavily MCP when TAVILY_API_KEY is set

  filesystem:
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "./workspace"]
    trust: untrusted
    enabled: true
    # The server enforces its own allowed-directory list; `jail` is the near
    # side of the same rule, checked before the call leaves this process, so
    # confinement does not rest on a third party staying correct.
    jail: ./workspace
    write_gate: true          # every write requires human_interrupt approval
    # 14 exported, 4 loaded. The other ten (directory_tree, get_file_info,
    # read_media_file, read_multiple_files, search_files, move_file,
    # create_directory, list_directory_with_sizes, list_allowed_directories,
    # read_file) were costing schema tokens on every turn for capability the
    # assistant never reaches for. Add one back the day something needs it.
    tools:
      - read_text_file
      - list_directory
      - write_file
      - edit_file
    # Listed explicitly rather than inferred: guessing which of a stranger's
    # tools mutate the disk is the guess that ends with a file overwritten.
    # Omit this list and write_gate gates ALL loaded tools.
    gated_tools:
      - write_file
      - edit_file
