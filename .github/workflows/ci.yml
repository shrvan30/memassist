name: ci
on:
  push:
    branches: [main, 'phase-*']
    tags: ['v*']          # a tag additionally publishes images (see `publish`)
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    # Backstop. Run #31 spent 14m19s on a leg that takes under 5 when healthy,
    # and produced no usable signal. Every step below is bounded too, so a stall
    # is attributed to a step rather than to "the job".
    timeout-minutes: 20
    # The benchmark embeds with a local bge-small model. Unpinned, HF caches it
    # under $HOME where nothing restores it, so every run re-downloads 135 MB.
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
    strategy:
      fail-fast: false
      matrix:
        # The storage layer has two implementations behind one surface; they
        # only stay equivalent if both are exercised. `sqlite` is the zero-setup
        # default, `postgres` boots a real pgvector service.
        backend: [sqlite, postgres]
    services:
      postgres:
        image: ${{ matrix.backend == 'postgres' && 'pgvector/pgvector:pg16' || '' }}
        env:
          POSTGRES_USER: memassist
          POSTGRES_PASSWORD: memassist
          POSTGRES_DB: memassist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memassist -d memassist"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # gitleaks needs history

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      - run: pip install -r requirements.txt
        timeout-minutes: 8

      # Run #31's real cause. The benchmark step took 706s on one leg and 12s
      # on the other for the same tree, because the only uncached external
      # dependency in it is a 135 MB model pulled from huggingface.co — cold,
      # on both matrix legs, in parallel, on every run. When that fetch stalls
      # the step burns eleven minutes and then fails with the embedder
      # unavailable, which reads as a hang with no attributable cause.
      # Cached, it is fetched once per model change instead of ~40 times a day.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ runner.os }}-${{ hashFiles('memory_server/storage/embedder.py') }}
          restore-keys: hf-${{ runner.os }}-

      # Defect #5, still on probation: one postgres leg failed with a bare
      # "exit code 1" and passed unchanged on the next run. The service
      # healthcheck is the runner's opinion that the container is up; this is
      # the suite's own opinion that it can connect and run a query, taken with
      # the same driver the tests use. If the database is not actually ready,
      # this says so here instead of as a mystery failure 40 tests in.
      - name: Wait for Postgres
        if: matrix.backend == 'postgres'
        run: |
          python - <<'PY'
          import sys, time
          import psycopg
          dsn = "postgresql://memassist:memassist@localhost:5432/memassist"
          deadline = time.time() + 60
          attempt = 0
          while True:
              attempt += 1
              try:
                  with psycopg.connect(dsn, connect_timeout=5) as conn:
                      conn.execute("SELECT 1").fetchone()
                      conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
                  print(f"postgres ready after {attempt} attempt(s)")
                  sys.exit(0)
              except Exception as exc:
                  if time.time() > deadline:
                      print(f"::error title=postgres never became ready::{exc}")
                      sys.exit(1)
                  print(f"attempt {attempt}: {type(exc).__name__}; retrying")
                  time.sleep(2)
          PY

      - name: Lint
        if: matrix.backend == 'sqlite'
        timeout-minutes: 3
        run: ruff check .

      - name: Unit + security tests (no LLM keys)
        # pytest-timeout caps each TEST at 120s and names the offender; this
        # caps the step, for a stall outside any single test (collection,
        # interpreter start, a leaked non-daemon thread at exit).
        timeout-minutes: 10
        env:
          # Set only on the postgres leg; unset, the dual-backend suite skips
          # its Postgres half rather than silently passing it.
          MEMASSIST_TEST_POSTGRES_DSN: ${{ matrix.backend == 'postgres' && 'postgresql://memassist:memassist@localhost:5432/memassist' || '' }}
        run: |
          set +e
          pytest tests/ -m "not llm" -q --tb=short > pytest.out 2>&1
          code=$?
          tail -n 60 pytest.out
          if [ $code -ne 0 ]; then
            # Downloading run logs needs admin rights on the repo, so a bare
            # "exit code 1" is all a non-admin can see. Annotations are public,
            # so the failure is republished as one.
            {
              echo -n "::error title=pytest (${{ matrix.backend }})::"
              tail -n 40 pytest.out | sed -z 's/\n/%0A/g'
              echo
            }
          fi
          exit $code

      - name: Benchmark (regression gate, must stay 115/115)
        # 8, not 12: run #31 stalled for 706s and a 12-minute cap would have let
        # it run almost to completion before tripping. With the model cached
        # this step is well under a minute, so 8 is already generous.
        timeout-minutes: 8
        env:
          MEMASSIST_BENCH_POSTGRES_DSN: ${{ matrix.backend == 'postgres' && 'postgresql://memassist:memassist@localhost:5432/memassist' || '' }}
        run: |
          python -m bench --json bench.json
          python - <<'PY'
          import json, sys
          r = json.load(open("bench.json"))
          print(f"bench: {r['total']}/{r['possible']}")
          sys.exit(0 if r["total"] == r["possible"] else 1)
          PY

      - name: Secret scan
        if: matrix.backend == 'sqlite'
        timeout-minutes: 5
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

      - name: Dependency audit
        if: matrix.backend == 'sqlite'
        # Queries the advisory database over the network, so it can stall.
        timeout-minutes: 6
        # PYSEC-2026-311: chromadb RCE via trust_remote_code on the /api/v2 HTTP
        # endpoint. No fixed release exists, and MemAssist runs Chroma embedded
        # (PersistentClient) with no server, so the endpoint does not exist here.
        # Drop the ignore once chromadb ships a fix.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-311

  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Dependency audit
        # Runtime deps only: dev tooling is not shipped, and a dev-only advisory
        # should not be able to block a release.
        run: npm audit --omit=dev --audit-level=high

  # Publish images to GHCR — tags only, and only after BOTH test jobs are green.
  # A tag is the release artifact, so it must never be able to ship an image
  # that the dual-backend suite and the benchmark have not passed.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # The two images are independent artifacts. With fail-fast (the default),
      # web failing in 11s cancelled the api build mid-flight, so one broken
      # image took down a release that was otherwise fine — and hid whether the
      # api leg would have succeeded at all.
      fail-fast: false
      matrix:
        include:
          - image: memassist-api      # also runs the memory-mcp service
            context: .
            dockerfile: Dockerfile
            build_args: ""
          # NEXT_PUBLIC_API_BASE is baked into the client bundle at BUILD time,
          # so it cannot be set when the container starts — it has to be decided
          # here. A RELATIVE base is the only value that suits a published
          # image: the browser then calls the same origin it loaded the page
          # from, so one image works behind any domain, and the reverse proxy
          # routes /api to the API (see deploy/Caddyfile). An absolute URL would
          # hard-code somebody else's hostname into a public artifact.
          #
          # Local `docker compose` is unaffected: it builds web itself and its
          # build arg still defaults to http://localhost:8000.
          - image: memassist-web
            context: ./web
            dockerfile: ./web/Dockerfile
            build_args: NEXT_PUBLIC_API_BASE=/api
    steps:
      - uses: actions/checkout@v4

      # arm64 is the point of this: the free hosting that actually fits this app
      # is Ampere (Oracle A1), and an amd64-only image will not run there at all.
      # GitHub's hosted runners are amd64, so the arm64 leg is emulated.
      - uses: docker/setup-qemu-action@v3

      # REQUIRED for the cache-to below, and the reason the v1.0.0 tag run died.
      # Without this the build uses the runner's default builder, which is on
      # the `docker` driver. That driver only supports cache export when the
      # containerd image store is enabled, and it is not on GitHub runners — so
      # buildx refused with "Cache export is not supported for the docker
      # driver" before it ever reached the registry. This action creates a
      # `docker-container` builder, which supports cache export unconditionally.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # `latest=auto` (the default, stated here because it bit us) already
          # adds :latest for a non-prerelease semver tag. An explicit
          # `type=raw,value=latest` on top of it emitted the tag TWICE —
          # visible in the failed run as a duplicated --tag argument. Auto is
          # also the behaviour we actually want: a v1.1.0-rc1 must not become
          # :latest, which a raw entry would have made it.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # The repository has no description set, so metadata-action emitted an
          # empty one. A published image should say what it is.
          labels: |
            org.opencontainers.image.description=A MemGPT-style personal assistant with infinite memory, running at $0/month

      - uses: docker/build-push-action@v6
        # EXPECT A LONG TAG BUILD. The arm64 leg runs under QEMU on an amd64
        # runner, so every compiled step costs roughly an order of magnitude
        # more than native. Measured shapes: the api image installs CPU torch
        # and then bakes bge-small by importing sentence-transformers, which is
        # emulated CPU work — budget 30-60 min for that leg, ~10 min for web.
        # Both matrix legs run in parallel, so the tag run is bounded by the api
        # image. Only tag pushes pay this; PRs never reach the publish job.
        #
        # The upgrade path, if that becomes tiresome, is a native arm64 runner
        # (ubuntu-24.04-arm) building each platform separately and merging the
        # manifest — more workflow for less wall clock. Not worth it at one
        # release at a time.
        timeout-minutes: 90
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The api image bakes bge-small into a layer, so it is worth caching.
          # Scoped per platform by buildx automatically; a shared scope would
          # have the two legs overwrite each other's cache manifest.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Nightly smoke benchmark (real free-tier keys via repo secrets).
  # Manual trigger only until quota impact is measured.
  # bench-smoke:
  #   if: github.event_name == 'workflow_dispatch'
  #   ...
