# Free-tier provider chain for the failover router (PROJECT_SPEC.md §3.1).
#
# NOTE: Free-tier limits change often — VERIFY base_url, model slugs, and budgets at
# signup. The budgets below are conservative planning defaults used for proactive
# skipping; they are not authoritative. `api_key_env` names the env var holding
# each provider's key (see .env.example).
#
# Providers are tried in `priority` order for the given `lane`. Phase 1 runs on
# whichever keys are present (typically gemini + groq); missing-key providers are
# skipped automatically.

providers:
  - name: gemini
    priority: 1
    # Use a Flash model that does STANDARD OpenAI tool-calling. Avoid Gemini 3.x
    # (gemini-flash-latest / gemini-3-*) here: they require round-tripping a
    # Google-specific `thought_signature` on every function call, which breaks
    # the flat cross-provider tool format (400 INVALID_ARGUMENT).
    #
    # NOT gemini-2.0-flash / -2.0-flash-001: both return HTTP 429 with
    # "limit: 0" on the current free tier — no allowance at all, so the router
    # cooled them down forever and Gemini served 0 requests through all of
    # Phase 1. Not gemini-2.5-flash either: 404 on this endpoint despite being
    # listed by /models. Verified 2026-07-29: 2.5-flash-lite answers and emits
    # standard flat tool_calls. Re-verify with `make bench LIVE=1`.
    model: gemini-2.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    context_window: 1048576
    daily_request_limit: 1500
    daily_token_limit: null
    rpm_limit: 15
    lanes: [interactive]
    role: Primary

  - name: groq
    priority: 2
    model: llama-3.3-70b-versatile
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    context_window: 131072
    daily_request_limit: 1000
    daily_token_limit: 100000
    rpm_limit: 30
    lanes: [interactive]
    role: Fast fallback

  - name: openrouter
    priority: 3
    # Configurable free model — verify a current `:free` slug at openrouter.ai/models.
    model: inclusionai/ling-3.0-flash:free
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    context_window: 32768
    daily_request_limit: 50
    daily_token_limit: null
    rpm_limit: 20
    lanes: [interactive]
    role: Emergency lane

  - name: mistral
    priority: 4
    model: mistral-small-latest
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    context_window: 32768
    daily_request_limit: null
    daily_token_limit: null
    rpm_limit: 2
    # Interactive last-resort AND the dedicated background/batch lane (§3.2).
    lanes: [interactive, background]
    role: Last resort + background
