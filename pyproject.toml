[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memassist"
version = "0.1.0"
description = "MemGPT-style personal assistant with infinite memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",          # OpenAI-compatible client for every router provider
    "pyyaml>=6.0",           # llm/providers.yaml
    "langgraph>=0.2",        # graph/ owns control flow only — never provider calls
    "langgraph-checkpoint-postgres>=2.0",  # durable turn state, paired with the pg backend
    "psycopg-pool>=3.2",     # the checkpointer's pool (turns run off the request thread)
    "langfuse>=3.0",         # Phase 5 tracing; inert unless LANGFUSE_* keys are set
    "langchain-mcp-adapters>=0.3",  # external MCP servers as tools
    "mcp>=1.29,<2",          # PINNED: adapters 0.3.1 break on mcp 2.0 (RequestContext)
    "chromadb>=0.5",
    "psycopg[binary]>=3.1",  # Postgres backend
    "pgvector>=0.2",         # vector(384) adapter
    "sentence-transformers>=2.7",  # local bge-small-en-v1.5 embeddings (384-d)
    "fastapi>=0.110",        # api/ service
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6", "pip-audit>=2.7"]

[tool.setuptools]
packages = ["agent", "api", "graph", "llm", "memory_server", "memory_server.storage", "security"]
py-modules = ["config", "assembly", "mcp_client"]

[tool.setuptools.package-data]
llm = ["providers.yaml"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly: ruff's implicit default rule set widens between releases,
# which would break CI on an unrelated ruff upgrade.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["llm: needs live provider keys (deselected in CI)"]
